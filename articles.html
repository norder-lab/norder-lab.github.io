<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>norder's portfolio | articles</title>

        <!-- CSS -->
        <link rel="stylesheet" href="./css/reset.css">
        <link rel="stylesheet" href="./css/tokens.css">
        <link rel="stylesheet" href="./css/layout.css">
        <link rel="stylesheet" href="./css/components.css">
        <link rel="stylesheet" href="./css/transitions.css">
        <link rel="stylesheet" href="./css/main.css">

        <!-- Lucide アイコン -->
        <script src="https://unpkg.com/lucide@latest" defer></script>

        <!-- Alpine.js プラグイン -->
        <script src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js" defer></script>

        <!-- 自作 JS -->
        <script src="./js/layout.js" defer></script>
        <script src="./js/palette.js" defer></script>
        <script src="./js/api.js" defer></script>
        <script src="./js/app.js" defer></script>

        <!-- Alpine.js 本体 -->
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

        <!-- フォント -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=Kosugi+Maru&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">

    </head>
    <body>
        <portfolio-layout>
            <h1>ARTICLES</h1>

            <div x-data="articlesPage">
                <div class="search-bar">
                    <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
                    <input
                        type="search"
                        id="article-search"
                        class="search-input"
                        placeholder="Search articles... (/)"
                        aria-label="記事を検索"
                        x-model="query"
                    >
                </div>

                <p class="list-status" x-show="loading">Loading articles from Qiita...</p>

                <p class="list-status" x-show="!loading && error" x-cloak>
                    記事一覧を取得できませんでした。
                    <a href="https://qiita.com/norder" target="_blank" rel="noopener noreferrer">Qiita で確認する</a>
                </p>

                <p class="list-status" x-show="!loading && !error && filtered.length === 0" x-cloak
                   x-text="items.length === 0 ? '公開中の記事はまだありません。' : '該当する記事が見つかりませんでした。'">
                </p>

                <ul class="item-list" aria-label="記事一覧" aria-live="polite" x-show="!loading && !error && paginated.length > 0" x-cloak>
                    <template x-for="article in paginated" :key="article.id">
                        <li class="list-item">
                            <a :href="article.url" target="_blank" rel="noopener noreferrer" class="list-item-link">
                                <div class="list-item-head">
                                    <h2 class="list-item-title" x-text="article.title"></h2>
                                    <time class="list-item-date" :datetime="article.datetime" x-text="article.date"></time>
                                </div>
                                <div class="tag-list list-item-tags" x-show="article.tags.length > 0">
                                    <template x-for="tag in article.tags" :key="tag">
                                        <span class="tag" x-text="tag"></span>
                                    </template>
                                </div>
                            </a>
                        </li>
                    </template>
                </ul>

                <nav class="pagination" aria-label="ページネーション" x-show="!loading && !error && filtered.length > 0" x-cloak>
                    <button type="button" class="pagination-btn" aria-label="前のページ" @click="prevPage()" :disabled="page <= 1">
                        <i data-lucide="chevron-left" aria-hidden="true"></i>
                    </button>
                    <span class="pagination-info" aria-current="page" x-text="`${page} / ${totalPages}`">1 / 1</span>
                    <button type="button" class="pagination-btn" aria-label="次のページ" @click="nextPage()" :disabled="page >= totalPages">
                        <i data-lucide="chevron-right" aria-hidden="true"></i>
                    </button>
                </nav>
            </div>
        </portfolio-layout>
    </body>

</html>
